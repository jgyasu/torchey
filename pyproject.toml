[project]
name = "jtorch"
version = "0.1.0"
description = "A lightweight tensor library built from scratch for learning ML system design"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Jigyasu", email = "jigyasu@outlook.in" }
]

keywords = [
    "machine-learning",
    "deep-learning",
    "tensor",
    "pytorch"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/jgyasu/jtorch"
Repository = "https://github.com/jgyasu/jtorch"
Issues = "https://github.com/jgyasu/jtorch/issues"